<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SEDMIRA — Экосистема 7 Ключей</title>
  
  <!-- Подключение шрифтов Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Подключение Telegram Web App API -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Подключение внешних стилей -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="app">
    <!-- Шапка приложения -->
    <header class="app-header">
      <div class="brand">
        <h1 class="logo-title">SEDMIRA</h1>
        <span class="key-badge">Ключ 1: Тело</span>
      </div>
      <div class="user-profile" id="userProfile">
        <!-- Ник пользователя из Telegram -->
      </div>
    </header>

    <!-- Главный контейнер контента -->
    <main class="main-content">
      
      <!-- Карточка выбранного дня/тренировки -->
      <section class="card workout-card" id="workoutCard">
        <div class="workout-header">
          <h2 id="dayTitle">Загрузка...</h2>
          <p id="daySubtitle" class="subtitle">Модуль физического развития</p>
        </div>

        <!-- Список упражнений -->
        <div class="exercise-list" id="exerciseList">
          <!-- Динамический список будет рендериться из config.js -->
        </div>
      </section>

      <!-- Панель управления (Таймер и Действия) -->
      <section class="controls-section">
        <div class="timer-display" id="timerDisplay">00:00</div>
        <div class="action-buttons">
          <button class="btn btn-primary" id="btnRest">Отдых</button>
          <button class="btn btn-secondary" id="btnFinish">Завершить</button>
        </div>
      </section>

    </main>

    <!-- Нижняя навигация по 7 Ключам -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="body">
        <span class="nav-icon">🧘‍♂️</span>
        <span class="nav-label">Тело</span>
      </button>
      <button class="nav-btn" data-tab="mind">
        <span class="nav-icon">🧠</span>
        <span class="nav-label">Разум</span>
      </button>
      <button class="nav-btn" data-tab="spirit">
        <span class="nav-icon">✨</span>
        <span class="nav-label">Дух</span>
      </button>
      <button class="nav-btn" data-tab="stats">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Прогресс</span>
      </button>
    </nav>
  </div>

  <!-- Подключение скриптов логики -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
